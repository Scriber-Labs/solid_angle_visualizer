[project]
name = "solid-angle-visualizer"
version = "0.1.0"
description = "Interactive 3D solid-angle visualization using Flask and Three.js."
readme = "README.md"
requires-python = ">=3.11"

authors = [
    { name = "Eigenscribe" }
]

dependencies = [
    "flask>=3.0.0",
    "numpy>=2.0.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["app"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
pythonpath = [
    "."
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
]

[tool.black]
line-length = 88
target-version = ["py311"]